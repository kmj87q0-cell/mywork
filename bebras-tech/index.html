<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🦫 Bebras Technology Challenge</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ========================= -->
    <!-- 상단 제목 -->
    <!-- ========================= -->

    <header>

        <h1>🦫 Bebras Technology Challenge</h1>

        <p class="subtitle">
            중학교 기술교과 컴퓨팅 사고력 챌린지
        </p>

    </header>

    <!-- ========================= -->
    <!-- 문제 영역 -->
    <!-- ========================= -->

    <section id="questionPanel">

        <h2>📖 문제</h2>

        <div id="questionText">

            비버는 아래 규칙대로 이동합니다.

            <br><br>

            ① 앞으로 2칸 이동

            <br>

            ② 오른쪽으로 1칸 이동

            <br>

            ③ 앞으로 1칸 이동

            <br><br>

            실행 후 비버의 위치를 맞혀보세요.

        </div>

    </section>

    <!-- ========================= -->
    <!-- 게임 영역 -->
    <!-- ========================= -->

    <section id="gameArea">

        <div id="grid">

            <!-- JavaScript에서 생성 -->

        </div>

    </section>

    <!-- ========================= -->
    <!-- 보기 -->
    <!-- ========================= -->

    <section id="answerPanel">

        <h2>🎯 정답 선택</h2>

        <div class="answers">

            <button class="answerBtn">A</button>

            <button class="answerBtn">B</button>

            <button class="answerBtn">C</button>

            <button class="answerBtn">D</button>

        </div>

    </section>

    <!-- ========================= -->
    <!-- 버튼 -->
    <!-- ========================= -->

    <section id="controlPanel">

        <button id="runBtn">

            ▶ 실행

        </button>

        <button id="submitBtn">

            ✔ 제출

        </button>

        <button id="resetBtn">

            🔄 다시하기

        </button>

    </section>

    <!-- ========================= -->
    <!-- 결과 -->
    <!-- ========================= -->

    <section id="resultPanel">

        <h2>📢 결과</h2>

        <div id="resultMessage">

            실행 버튼을 눌러 시작하세요.

        </div>

    </section>

    <!-- ========================= -->
    <!-- Footer -->
    <!-- ========================= -->

    <footer>

        Version 1.0

        <br>

        Bebras Technology Challenge

    </footer>

    <script src="problems.js"></script>
    <script src="script.js"></script>

</body>

</html>
